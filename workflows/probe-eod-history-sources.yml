name: Probe EOD/Long-History Data Sources

# Manual-only investigation workflow (scripts/probe-eod-history-sources.ts) for Bagian H's "History
# jangka panjang" section of the 2026-09-01 chart+RR engine follow-up: checks whether Bybit/Binance
# already support daily/weekly/monthly kline intervals (for crypto long-history, no new provider
# needed) and whether Yahoo Finance's DAILY-granularity endpoint still works for XAUUSD=X/forex even
# though the intraday XAUUSD=X symbol is confirmed permanently delisted. This sandbox's egress to
# every domain probed is blocked, so this runs via GitHub Actions - same established workaround used
# elsewhere in this project. No secrets required (all endpoints are public).
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe-eod-history-sources:
    name: Check crypto D/W/M klines + Yahoo daily-granularity XAU/forex endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Probe EOD/long-history data sources
        run: npm run probe:eod-history-sources
